{% extends 'base.html' %}

{% block title %}Admin Login | CoderesQ{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-xl relative">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/40 mx-auto flex items-center justify-center text-indigo-400 text-xl mb-3 shadow-lg">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-white">Administrator Access</h2>
            <p class="text-xs text-slate-400 mt-1">Authenticate to access CoderesQ competition control</p>
        </div>

        <form action="{{ url_for('auth.admin_login') }}" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Admin Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user-shield text-xs"></i>
                    </span>
                    <input type="text" id="username" name="username" required placeholder="admin"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-key text-xs"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••••••"
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="w-full py-3 px-4 rounded-xl font-bold text-white bg-indigo-600 hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
                    <span>Log In to Dashboard</span>
                </button>
            </div>

            <div class="p-3 rounded bg-slate-950/60 border border-slate-800 text-[11px] text-slate-500 font-mono text-center">
                Default Credentials: <strong>admin</strong> / <strong>CoderesQ@Admin2026</strong>
            </div>
        </form>
    </div>
</div>
{% endblock %}
